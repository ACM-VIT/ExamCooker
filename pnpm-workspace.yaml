packages:
  - packages/*

allowBuilds:
  '@posthog/cli': true
  '@mongodb-js/zstd': true
  core-js: false
  core-js-pure: false
  esbuild: true
  node-liblzma: false
  sharp: true
  workerd: true

minimumReleaseAgeExclude:
  - postcss@8.5.30
  - '@posthog/cli@0.18.11'

peerDependencyRules:
  allowedVersions:
    # Agents pins 2.0.0 peers; the 2.3.1 bundle passes worker checks and local startup.
    'agents>@modelcontextprotocol/client': 2.3.1
    'agents>@modelcontextprotocol/server': 2.3.1

overrides:
  '@modelcontextprotocol/sdk@<1.31.0': 1.32.1
  glob@>=10.0.0 <12.0.0: 13.0.6
  katex@<0.18.2: 0.19.0
  proxy-addr@<2.0.8: 2.0.8
  sharp@<0.35.5: 0.35.5
  source-map-js@<1.2.2: 1.2.2
  vue@<3.5.42: 3.5.42
  brace-expansion@>=2.0.0 <2.1.7: 2.1.7
  brace-expansion@>=4.0.0 <5.0.12: 5.0.12
  devalue@>=5.0.0 <5.9.3: 5.9.3
  nanoid@<3.3.18: 3.3.18
  qs@<6.16.0: 6.16.0
  '@xmldom/xmldom@<0.9.12': 0.9.12
  dompurify: 3.4.17
  fast-uri@<3.1.8: 3.1.8
  fast-xml-builder: 1.3.1
  hono: 4.13.13
  ip-address: 10.7.4
  minimatch@<3.1.4: 3.1.4
