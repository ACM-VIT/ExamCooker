name: Configure canary build secrets

on:
  workflow_dispatch:
  push:
    branches: [codex/ec-production-performance]
    paths: [.github/workflows/cloudflare-build-secrets.yml]

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Configure the two canary build triggers
        env:
          CF_BUILDS_SETUP_TOKEN: ${{ secrets.CF_BUILDS_SETUP_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
          POSTHOG_CLI_PROJECT_ID: ${{ vars.POSTHOG_CLI_PROJECT_ID }}
          POSTHOG_CLI_HOST: ${{ vars.POSTHOG_CLI_HOST || 'https://eu.posthog.com' }}
          NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}
          NEXT_PUBLIC_POSTHOG_PROXY_PATH: ${{ vars.NEXT_PUBLIC_POSTHOG_PROXY_PATH }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const variables = {};
          for (const name of ['DATABASE_URL', 'POSTHOG_CLI_API_KEY', 'POSTHOG_CLI_PROJECT_ID', 'POSTHOG_CLI_HOST', 'NEXT_PUBLIC_POSTHOG_KEY', 'NEXT_PUBLIC_POSTHOG_HOST', 'NEXT_PUBLIC_POSTHOG_PROXY_PATH']) {
            assert(process.env[name], `Missing ${name}`);
            variables[name] = { is_secret: true, value: process.env[name] };
          }
          assert(process.env.CF_BUILDS_SETUP_TOKEN, 'A temporary Workers CI Write token is required');
          for (const [name, value] of Object.entries({
            PNPM_VERSION: '12.8.1', NODE_OPTIONS: '--max-old-space-size=8192',
            AUTH_SECRET: 'ci-auth-secret-for-build-only', NEXTAUTH_SECRET: 'ci-auth-secret-for-build-only',
            AUTH_GOOGLE_ID: 'ci-google-id.apps.googleusercontent.com', AUTH_GOOGLE_SECRET: 'ci-google-secret',
            NEXT_PUBLIC_MICROSERVICE_URL: 'https://upload.examcooker.acmvit.in',
          })) variables[name] = { is_secret: false, value };
          const account = '4ee36e42cabfd44e8ce61b2a6bd637c5';
          for (const trigger of ['67ad2001-84ee-4c6e-a60f-aeb49aad0949', '054883db-4124-4bc8-8d25-34d296340181']) {
            const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/builds/triggers/${trigger}/environment_variables`, {
              method: 'PATCH', headers: { Authorization: `Bearer ${process.env.CF_BUILDS_SETUP_TOKEN}`, 'Content-Type': 'application/json' },
              body: JSON.stringify(variables),
            });
            const result = await response.json();
            assert(response.ok && result.success, `Build variable update failed (${response.status}; codes: ${result.errors?.map(error => error.code).join(',')})`);
            console.log(`Configured ${Object.keys(variables).length} build variables for ${trigger}`);
          }
          JS
